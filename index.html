<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>按国家展示画作 — Hetalia</title>
<style>
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
  #container { display:flex; height:100vh; }
  #map { flex:1; position:relative; }
  svg { width:100%; height:100%; display:block; }
  .country { fill:#dcdcdc; stroke:#fff; stroke-width:0.5; cursor:pointer; transition:fill .15s; }
  .country:hover { fill:#b3d4ff; }
  .country.selected { fill:#4a90e2; }
  #sidebar {
    width:340px; max-width:40%; background:#fff; border-left:1px solid #e6e6e6;
    box-shadow: -4px 0 12px rgba(0,0,0,0.06); padding:12px; overflow:auto;
  }
  #sidebar h2 { margin:6px 0 12px; font-size:18px; }
  .art-list { display:flex; flex-wrap:wrap; gap:8px; }
  .art-item { width:100%; display:flex; gap:8px; margin-bottom:10px; }
  .thumb { width:96px; height:72px; object-fit:cover; border-radius:4px; cursor:pointer; }
  .art-meta { flex:1; }
  .btn-close { background:#eee; border:none; padding:6px 8px; border-radius:4px; cursor:pointer; }
  .no-art { color:#666; padding:12px 0; }
  .wiki-link { color:#0645ad; text-decoration:underline; cursor:pointer; }
  .subpage { padding-top:8px; }
  /* modal */
  #modal {
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background: rgba(0,0,0,0.6); z-index:30;
  }
  #modal .modal-inner { background:#fff; padding:12px; border-radius:6px; max-width:90%; max-height:90%; overflow:auto; }
  #modal img { max-width:100%; height:auto; display:block; border-radius:4px; }
  #tooltip {
    position:absolute; pointer-events:none; background:rgba(0,0,0,0.75); color:#fff; padding:6px 8px; border-radius:4px; font-size:13px; display:none;
  }
  @media (max-width:800px){
    #container { flex-direction:column; }
    #sidebar { width:100%; max-height:45vh; border-left:none; border-top:1px solid #e6e6e6; }
  }
</style>
</head>
<body>
<div id="container">
  <div id="map"><div id="tooltip"></div></div>
  <aside id="sidebar">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2>请选择一个国家</h2>
      <button id="clearBtn" class="btn-close">清除</button>
    </div>
    <div id="countryInfo">
      <p class="no-art">点选地图上的国家以查看对应画作。</p>
    </div>
  </aside>
</div>

<div id="modal" aria-hidden="true">
  <div class="modal-inner">
    <button id="closeModal" class="btn-close" style="float:right">关闭</button>
    <div id="modalContent"></div>
  </div>
</div>

<!-- d3 v7 -->
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
/*
  使用演示 GeoJSON（含国家名称）。如果未来需要离线、加速或更精确的属性，请换成其它 GeoJSON 文件。
*/
const geojsonUrl = 'https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json';

/*
  artworkData：把你的画作按国家代码或国家名挂到这里。
  推荐用 ISO 3166-1 alpha-2（两字母）代码作为 key，例如 "JP","US","FR"。
  也支持使用国家中文/英文名作为 key（示例中也包含了英文名备用）。
  每个值是数组：{ title, url, year, desc } —— 你可以按需扩展字段。
*/
const artworkData = {
  "JP": [
    { title: "富士山之梦", url: "https://picsum.photos/id/1011/1200/800", year: 2024, desc: "以日本为灵感的油画。" },
    { title: "都市夜景", url: "https://picsum.photos/id/1025/1200/800", year: 2023, desc: "现代城市氛围。" }
  ],
  "FR": [
    { title: "巴黎光影", url: "https://picsum.photos/id/1003/1200/800", year: 2022, desc: "在法国创作的系列之一。" }
  ],
  "United States": [ /* 用英文名作为备用 key */ 
    { title: "大地之色", url: "https://picsum.photos/id/1015/1200/800", year: 2021, desc: "与美国有关的题材。" }
  ],
  /* 使用你已上传的本地图像（假设放到 assets/art/China.png） */
  "CN": [
    { title: "长城晨曦", url: "assets/art/China.png", year: 2020, desc: "描绘中国山川。" }
  ]
};

const width = Math.max(700, window.innerWidth * 0.6);
const height = Math.max(400, window.innerHeight);

const svg = d3.select("#map").append("svg")
  .attr("viewBox", `0 0 ${width} ${height}`)
  .attr("preserveAspectRatio", "xMidYMid meet");

const tooltip = d3.select("#tooltip");

const projection = d3.geoMercator()
  .scale((width / 2 / Math.PI) * 1.1)
  .translate([width / 2, height / 1.8]);

const path = d3.geoPath().projection(projection);

let selectedCountryPath = null;

function renderMap(){
  d3.json(geojsonUrl).then(world => {
    svg.append("g")
      .selectAll("path")
      .data(world.features)
      .join("path")
        .attr("class", "country")
        .attr("d", path)
        .on("mouseover", (event, d) => {
           d3.select(event.currentTarget).raise();
           tooltip.style("display","block").text(getCountryDisplayName(d));
        })
        .on("mousemove", (event) => {
           tooltip.style("left", (event.pageX + 12) + "px")
                  .style("top", (event.pageY + 12) + "px");
        })
        .on("mouseout", () => {
           tooltip.style("display","none");
        })
        .on("click", (event, d) => {
           // remove previous selection
           svg.selectAll(".country").classed("selected", false);
           d3.select(event.currentTarget).classed("selected", true);
           selectedCountryPath = event.currentTarget;
           showArtworksForCountry(d);
        });
  }).catch(err => {
    document.getElementById('countryInfo').innerHTML = '<p class="no-art">地图加载失败，请检查网络或替换 GeoJSON URL。</p>';
    console.error(err);
  });
}

/* 辅助：尽可能从 GeoJSON 获取 iso2（两字母），否则用 name */
function getCountryKey(d){
  const props = d.properties || {};
  const candidates = [props.iso_a2, props.ISO_A2, props.iso2, props.iso, props.ISO, props.ISO_A3, props.id, props.adm0_a3];
  for (const c of candidates){
    if (c && typeof c === 'string' && c.trim().length>0){
      return c.trim();
    }
  }
  if (props.name) return props.name;
  if (props.NAME) return props.NAME;
  if (d.id) return d.id;
  if (props.ADMIN) return props.ADMIN;
  return null;
}
function getCountryDisplayName(d){
  const props = d.properties || {};
  return props.name || props.NAME || props.ADMIN || getCountryKey(d) || '';
}

/* 显示某国家的画作列表（在侧栏内） */
function showArtworksForCountry(d){
  const key = getCountryKey(d);
  const name = getCountryDisplayName(d);
  // 尝试多种 key：两字母、全大写、英文名
  const possibleKeys = [key, (key||'').toUpperCase(), (key||'').toLowerCase(), name, propsNameToEnglish(name)];
  let arts = null;
  for (const k of possibleKeys){
    if (!k) continue;
    if (artworkData[k]) { arts = artworkData[k]; break; }
  }
  // fallback: try matching by English name directly
  if (!arts && artworkData[name]) arts = artworkData[name];

  const container = document.getElementById('countryInfo');
  container.innerHTML = '';
  const header = document.createElement('div');
  header.style.display = 'flex'; header.style.justifyContent='space-between'; header.style.alignItems='center';
  const h = document.createElement('h3'); h.textContent = name; header.appendChild(h);
  const backLink = document.createElement('button'); backLink.className='btn-close'; backLink.textContent='回到地图';
  backLink.onclick = () => { clearSelection(); };
  header.appendChild(backLink);
  container.appendChild(header);

  if (!arts || arts.length===0){
    const p = document.createElement('p'); p.className = 'no-art'; p.textContent = '该国家暂无画作（你可以把图片上传到 assets/art/ 并在 artworkData 中添加）。';
    container.appendChild(p);
    return;
  }

  const list = document.createElement('div'); list.className = 'art-list';
  arts.forEach((a, idx) => {
    const item = document.createElement('div'); item.className='art-item';
    const img = document.createElement('img'); img.className='thumb'; img.src = a.url;
    img.alt = a.title || '';
    img.onclick = () => openModal(a);
    const meta = document.createElement('div'); meta.className='art-meta';
    const title = document.createElement('div');
    // wiki-like link
    const titleLink = document.createElement('span'); titleLink.className='wiki-link'; titleLink.textContent = a.title || 'Untitled';
    titleLink.onclick = () => { showSubpage(name, idx, arts); };
    title.appendChild(titleLink);
    const year = document.createElement('div'); year.style.color='#666'; year.style.fontSize='13px'; year.textContent = a.year ? a.year : '';
    const desc = document.createElement('div'); desc.style.marginTop='6px'; desc.style.color='#333'; desc.textContent = a.desc || '';
    meta.appendChild(title); meta.appendChild(year); meta.appendChild(desc);
    item.appendChild(img); item.appendChild(meta);
    list.appendChild(item);
  });
  container.appendChild(list);
}

/* wiki-link 行为：在侧栏内打开“分頁”视图（单页面内跳转），并更新 hash 以便可分享/返回 */
function showSubpage(countryName, artIndex, arts){
  const container = document.getElementById('countryInfo');
  container.innerHTML = '';
  const title = document.createElement('h3'); title.textContent = arts[artIndex].title || countryName; container.appendChild(title);
  const nav = document.createElement('div'); nav.className='subpage';
  const back = document.createElement('span'); back.className='wiki-link'; back.textContent='← 返回列表'; back.onclick = () => {
    // simulate going back to listing for currently selected country
    // find the feature by display name on map and call showArtworksForCountry
    const features = svg.selectAll('path').data();
    const feature = features.find(f => getCountryDisplayName(f) === countryName);
    if (feature) showArtworksForCountry(feature);
    else document.getElementById('countryInfo').innerHTML = '<p class="no-art">无法找到该国家的地图数据。</p>';
    history.pushState(null, '', '#');
  };
  nav.appendChild(back);
  container.appendChild(nav);

  const art = arts[artIndex];
  const img = document.createElement('img'); img.src = art.url; img.alt = art.title || '';
  img.style.maxWidth='100%'; img.style.borderRadius='6px'; img.style.marginTop='10px';
  container.appendChild(img);
  const desc = document.createElement('p'); desc.textContent = art.desc || '';
  container.appendChild(desc);

  // update hash for sharing
  const encoded = encodeURIComponent(countryName);
  history.pushState(null, '', `#art/${encoded}/${artIndex}`);
}

function openModal(a){
  document.getElementById('modalContent').innerHTML = '';
  const h = document.createElement('h3'); h.textContent = a.title || '';
  const img = document.createElement('img'); img.src = a.url; img.alt = a.title || '';
  const p = document.createElement('p'); p.textContent = a.desc || '';
  document.getElementById('modalContent').appendChild(h);
  document.getElementById('modalContent').appendChild(img);
  document.getElementById('modalContent').appendChild(p);
  document.getElementById('modal').style.display='flex';
}

function closeModal(){ document.getElementById('modal').style.display='none'; }

function clearSelection(){
  svg.selectAll('.country').classed('selected', false);
  selectedCountryPath = null;
  document.getElementById('countryInfo').innerHTML = '<p class="no-art">点选地图上的国家以查看对应画作。</p>';
  history.pushState(null, '', '#');
}

// helper: sometimes name translation mapping (简单占位，后面可扩充)
function propsNameToEnglish(name){
  // 你可以在这里扩展常见中文名到英文名映射，例如：
  const map = { '中国': 'China', '日本': 'Japan', '美国': 'United States' };
  return map[name] || name;
}

// 处理 hash 支持：如果用户直接打开 #art/China/0，会展开对应子页
function handleHashOnLoad(){
  const h = location.hash || '';
  if (!h) return;
  const m = h.match(/^#art\/(.+)\/(\d+)$/);
  if (m){
    const countryName = decodeURIComponent(m[1]);
    const artIndex = parseInt(m[2], 10);
    // wait until map loaded
    const tryShow = () => {
      const features = svg.selectAll('path').data ? svg.selectAll('path').data() : null;
      if (!features || features.length===0){
        setTimeout(tryShow, 200);
        return;
      }
      const feature = features.find(f => getCountryDisplayName(f) === countryName || getCountryKey(f) === countryName || (f.properties && (f.properties.name === countryName || f.properties.ADMIN === countryName)));
      if (feature){
        // mark selection on map
        svg.selectAll('.country').classed('selected', false);
        // find matching path element and add class
        svg.selectAll('path').filter(d => getCountryDisplayName(d) === countryName || getCountryKey(d) === countryName).classed('selected', true);
        showArtworksForCountry(feature);
        // then open subpage
        const arts = artworkData[getCountryKey(feature)] || artworkData[getCountryDisplayName(feature)];
        if (arts && arts[artIndex]) showSubpage(getCountryDisplayName(feature), artIndex, arts);
      }
    };
    tryShow();
  }
}

// 点击清除按钮
document.getElementById('clearBtn').addEventListener('click', clearSelection);
// modal 关闭
document.getElementById('closeModal').addEventListener('click', closeModal);
// 点击遮罩也关闭
document.getElementById('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });

renderMap();
handleHashOnLoad();

</script>
</body>
</html>
